name: Security
on:
  push:
  pull_request:
  merge_group:
  schedule:
    - cron: '26 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified cargo-audit
        env:
          AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/cargo-audit.tgz" https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "$AUDIT_SHA256  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/audit-tool"
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP/audit-tool" --strip-components=1
          echo "$RUNNER_TEMP/audit-tool" >> "$GITHUB_PATH"
      - name: Audit the workspace lockfile
        run: cargo audit --file Cargo.lock --json > audit-report.json
      - name: Summarize advisories, including non-blocking warnings
        if: always()
        run: python3 scripts/summarize-audit.py audit-report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit
          path: audit-report.json
          retention-days: 14
          if-no-files-found: warn
  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        if: matrix.language == 'rust'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@93a54aaef5ced74c8d9fae64bdfb97f6a18c21b4 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@93a54aaef5ced74c8d9fae64bdfb97f6a18c21b4 # v4
        with:
          category: /language:${{ matrix.language }}
