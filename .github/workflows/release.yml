name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching Cargo.toml and tauri.conf.json (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Validate the tag before checkout
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Check version metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/check-release.py "$RELEASE_TAG"
      - name: Require license and redistribution clearance
        run: python3 scripts/check-licenses.py --release
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --locked -p codex-dock-core
      - run: python3 scripts/check-ui.py
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build AppImage, Debian and RPM packages
        run: make release
      - name: Build and verify portable Linux archive
        run: |
          make package-linux
          python3 scripts/check-linux-package.py dist/*.tar.gz
      - name: Build Arch package with pinned disposable tools
        run: sh packaging/package-arch-container.sh
      - name: Collect only release packages and checksums
        run: |
          mkdir release-artifacts
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm dist/*.tar.gz dist/*.pkg.tar.zst release-artifacts/
          cd release-artifacts
          sha256sum -- *.AppImage *.deb *.rpm *.tar.gz *.pkg.tar.zst > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: release-artifacts/
          retention-days: 14
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Configure this environment with required maintainer reviewers in GitHub.
    environment: release-review
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require configured maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          approved=$(gh api "repos/$GH_REPO/environments/release-review" --jq 'any(.protection_rules[]; .type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length) > 0)')
          test "$approved" = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-artifacts
      - name: Verify downloaded release checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Create an unpublished release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Codex Dock $RELEASE_TAG" release-artifacts/*
