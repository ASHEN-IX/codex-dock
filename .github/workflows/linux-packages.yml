name: Linux packages
on:
  workflow_dispatch:
  push:
    branches: [main, packaging/linux-bundle]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 45
    # Build on Ubuntu 22.04 for an older glibc baseline. Ubuntu 24.04 provides
    # a second compile/test environment; artifacts remain distro/ABI dependent.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf sqlite3 libarchive-tools
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test core
        run: cargo test --locked -p codex-dock-core
      - name: Build Linux archive
        run: make package-linux
      - name: Verify portable package and isolated installer lifecycle
        run: python3 scripts/check-linux-package.py dist/*.tar.gz
      - name: Install Tauri packaging CLI
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build AppImage, Debian and RPM packages
        if: matrix.os == 'ubuntu-22.04'
        run: make release
      - name: Inspect native package notices and AppImage components
        if: matrix.os == 'ubuntu-22.04'
        run: |
          python3 scripts/check-native-package-notices.py target/release/bundle
          python3 scripts/inventory-native-appimage.py dist/appimage-inspection/squashfs-root dist/native-review
      - name: Install and remove Debian package on disposable runner
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p "$HOME/.codex-profiles/release-test"
          printf disposable > "$HOME/.codex-profiles/release-test/preserve"
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          ldd /usr/bin/codex-dock > "$RUNNER_TEMP/dock-ldd.txt"
          if rg 'not found' "$RUNNER_TEMP/dock-ldd.txt"; then exit 1; fi
          command -v sqlite3
          cmp LICENSE /usr/share/licenses/codex-dock/LICENSE
          cmp NOTICE /usr/share/licenses/codex-dock/NOTICE
          cmp THIRD-PARTY-NOTICES.txt /usr/share/licenses/codex-dock/THIRD-PARTY-NOTICES.txt
          sudo apt-get remove -y codex-dock
          test ! -e /usr/bin/codex-dock
          test "$(cat "$HOME/.codex-profiles/release-test/preserve")" = disposable
      - name: Build Arch package with pinned disposable tools
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sh packaging/package-arch-container.sh
          python3 scripts/check-native-package-notices.py --arch dist/*.pkg.tar.zst
      - name: Checksum every package
        run: |
          for package in dist/*.tar.gz dist/*.pkg.tar.zst target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm; do
            test ! -f "$package" || sha256sum "$package"
          done > dist/SHA256SUMS
          sha256sum --check dist/SHA256SUMS
      - name: Upload downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-dock-linux-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.pkg.tar.zst
            dist/SHA256SUMS*
            dist/native-review/
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
