name: Linux packages
on:
  workflow_dispatch:
  push:
    branches: [main, packaging/linux-bundle]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    # Build on Ubuntu 22.04 for an older glibc baseline. Ubuntu 24.04 provides
    # a second compile/test environment; artifacts remain distro/ABI dependent.
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf sqlite3
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test core
        run: cargo test --locked -p codex-dock-core
      - name: Build Linux archive
        run: make package-linux
      - name: Install Tauri packaging CLI
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build AppImage, Debian and RPM packages
        if: matrix.os == 'ubuntu-22.04'
        run: make release
      - name: Upload downloadable packages
        uses: actions/upload-artifact@v4
        with:
          name: codex-dock-linux-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
