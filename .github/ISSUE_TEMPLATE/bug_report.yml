name: Bug report
description: Report a reproducible problem using sanitized details
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach auth files, tokens, databases, private chats or raw sensitive logs. Use Security → Report a vulnerability for sensitive defects.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release version or git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Linux distribution/version, desktop/compositor, Wayland or X11, Codex CLI version, and install method.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproduction possible using synthetic account names and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove account IDs, file paths containing private details, project names, tokens and message contents.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials and private account/chat data from this report.
          required: true
