<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codex Dock</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-2: #171b21;
    --line: #22262d;
    --text: #e8edf3;
    --dim: #8b949e;
    --faint: #5b636d;
    --green: #3ddc97;
    --amber: #d9a12b;
    --red: #f2615c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }
  .mark {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    /* Same gauge as the tray icon: filled arc = worst 5-hour reading. */
    background: conic-gradient(var(--fill, var(--faint)) var(--p, 0%),
                               #2b313b 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
    transition: background .4s;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .spacer { flex: 1; }

  .pill {
    font-size: 11px;
    color: var(--dim);
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 99px;
    white-space: nowrap;
  }
  .pill.ok { color: var(--green); border-color: rgba(61,220,151,.28); }
  .pill.bad { color: var(--red); border-color: rgba(242,97,92,.32); }

  button {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #1e232b; border-color: #2f353e; }
  button:active { transform: translateY(.5px); }
  button.ghost { background: transparent; color: var(--dim); border-color: transparent; }
  button.ghost:hover { color: var(--text); background: var(--panel-2); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary {
    background: rgba(61,220,151,.13);
    border-color: rgba(61,220,151,.32);
    color: #9df0c6;
  }
  button.primary:hover { background: rgba(61,220,151,.2); border-color: rgba(61,220,151,.5); }
  button.danger { color: var(--red); border-color: rgba(242,97,92,.34); background: rgba(242,97,92,.1); }
  button.danger:hover { background: rgba(242,97,92,.18); border-color: rgba(242,97,92,.55); }
  button.mini {
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: transparent; border-color: transparent; color: var(--faint);
  }
  button.mini:hover { color: var(--red); background: rgba(242,97,92,.08); }

  main { padding: 16px 20px 24px; }

  .actions { display: flex; gap: 6px; align-items: center; }

  .acct {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 12px 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--panel);
    margin-bottom: 10px;
  }
  .acct:hover { border-color: #2b313a; }

  .row1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .name { font-weight: 600; font-size: 13.5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.live { background: var(--green); }
  .meta { font-size: 11.5px; color: var(--dim); }
  .meta.sep::before { content: "·"; margin: 0 6px; color: var(--faint); }
  .err { color: var(--red); }
  .warn { color: var(--amber); }

  .bars { grid-column: 1 / -1; display: grid; gap: 8px; margin-top: 2px; }
  .bar {
    display: grid;
    grid-template-columns: 44px 1fr 52px;
    align-items: center;
    gap: 10px;
  }
  .bar .label { font-size: 11px; color: var(--dim); }
  .track { height: 5px; border-radius: 99px; background: #1d2229; overflow: hidden; }
  .fill {
    height: 100%;
    border-radius: 99px;
    background: var(--green);
    transition: width .45s cubic-bezier(.2,.8,.2,1), background .3s;
  }
  .fill.amber { background: var(--amber); }
  .fill.red { background: var(--red); }
  .fill.none { background: transparent; }
  .bar .value {
    font-size: 11.5px;
    color: var(--dim);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .bar .value.hot { color: var(--amber); }
  .bar .value.crit { color: var(--red); }

  .foot {
    grid-column: 1 / -1;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 11px;
    color: var(--faint);
    margin-top: 2px;
  }
  .foot b { color: var(--dim); font-weight: 500; }

  .empty {
    border: 1px dashed var(--line);
    border-radius: 11px;
    padding: 28px;
    text-align: center;
    color: var(--dim);
    font-size: 12.5px;
  }

  .banner {
    border: 1px solid rgba(242,97,92,.3);
    background: rgba(242,97,92,.06);
    color: #ffb3b0;
    border-radius: 9px;
    padding: 10px 14px;
    font-size: 12px;
    margin-bottom: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .banner span { flex: 1; }

  /* --- add / sign in / delete --- */
  dialog {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 13px;
    padding: 0;
    width: 360px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
  .dlg { padding: 18px 20px; }
  .dlg h2 { font-size: 13.5px; font-weight: 600; margin: 0 0 4px; }
  .dlg p { font-size: 11.5px; color: var(--dim); margin: 0 0 14px; line-height: 1.55; }
  .dlg label { display: block; font-size: 11px; color: var(--dim); margin: 12px 0 5px; }
  .dlg input, .dlg select {
    width: 100%; font: inherit; font-size: 12.5px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; outline: none;
  }
  .dlg input:focus, .dlg select:focus { border-color: #3a424d; }
  .dlg .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .code {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 19px; letter-spacing: .14em; text-align: center;
    padding: 13px; margin: 12px 0 10px;
    background: var(--bg); border: 1px dashed var(--line); border-radius: 8px;
    user-select: text;
  }
  .code.waiting { color: var(--faint); font-size: 12px; letter-spacing: 0; font-family: inherit; }
  .dlg a { color: var(--green); font-size: 11.5px; word-break: break-all; text-decoration: none; }
  .dlg a:hover { text-decoration: underline; }
  .dlg .note { font-size: 11px; color: var(--faint); margin-top: 10px; line-height: 1.5; }
  .dlg .hint { font-size: 10.5px; color: var(--faint); margin-top: 4px; }
  .dlg .hint.bad { color: var(--red); }
  .steps { counter-reset: step; margin: 0 0 2px; padding: 0; list-style: none; }
  .steps li {
    position: relative; padding-left: 22px; margin-bottom: 6px;
    font-size: 11.5px; color: var(--dim); line-height: 1.5;
  }
  .steps li::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: 0; top: 1px;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--dim); font-size: 9.5px; text-align: center; line-height: 14px;
  }
  .steps li.done::before { content: "✓"; color: var(--green); border-color: rgba(61,220,151,.35); }
  .prog { height: 3px; border-radius: 99px; background: #1d2229; overflow: hidden; margin: 12px 0 0; }
  .prog > i { display: block; height: 100%; width: 34%; border-radius: 99px;
    background: var(--green); animation: slide 1.5s ease-in-out infinite; }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
</style>
</head>
<body>
<header>
  <div class="mark" id="mark"></div>
  <h1>Codex Dock</h1>
  <span class="pill" id="store">checking…</span>
  <div class="spacer"></div>
  <button class="ghost" id="add">Add account</button>
  <button class="ghost" id="repair">Repair store</button>
  <button class="ghost" id="refresh">Refresh</button>
</header>
<main>
  <div id="banner"></div>
  <div id="accounts"></div>
</main>

<dialog id="addDlg">
  <form class="dlg" id="addForm" method="dialog">
    <h2>Add an account</h2>
    <p>A new profile gets its own sign-in but shares this machine's chats.</p>
    <label for="newName">Name</label>
    <input id="newName" name="name" placeholder="personal" autocomplete="off" spellcheck="false" />
    <label for="newClone">Copy settings from</label>
    <select id="newClone" name="clone"><option value="">Nothing — start clean</option></select>
    <div class="row">
      <button type="button" class="ghost" data-close>Cancel</button>
      <button type="submit" class="primary" id="addGo">Create</button>
    </div>
  </form>
</dialog>

<dialog id="loginDlg">
  <div class="dlg">
    <h2>Sign in to <span id="loginName"></span></h2>
    <ol class="steps">
      <li id="stepOpen">Open the link and sign in to the account you want here</li>
      <li id="stepCode">Enter the one-time code below</li>
    </ol>
    <div class="code waiting" id="loginCode">starting…</div>
    <a id="loginUrl" href="#" hidden></a>
    <div class="prog" id="loginProg"><i></i></div>
    <div class="row">
      <button type="button" class="ghost" data-cancel-login>Cancel</button>
    </div>
  </div>
</dialog>

<dialog id="askDlg">
  <div class="dlg">
    <h2 id="askTitle">Remove account</h2>
    <p id="askBody"></p>
    <div class="note" id="askNote"></div>
    <div class="row">
      <button type="button" class="ghost" data-close>Cancel</button>
      <button type="button" class="danger" id="askGo">Remove</button>
    </div>
  </div>
</dialog>
<script>
const invoke = window.__TAURI__?.core?.invoke ?? window.__TAURI__?.invoke;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function level(v) {
  if (v === null || v === undefined) return 'none';
  return v >= 85 ? 'red' : v >= 60 ? 'amber' : '';
}

function bar(label, pct) {
  const v = (pct === null || pct === undefined) ? null : Number(pct);
  const cls = level(v);
  const hot = cls === 'red' ? ' crit' : cls === 'amber' ? ' hot' : '';
  const text = v === null ? '—' : v.toFixed(1) + '%';
  const w = v === null ? 0 : Math.max(0, Math.min(v, 100));
  return `<div class="bar">
    <span class="label">${label}</span>
    <div class="track"><div class="fill ${cls}" style="width:${w}%"></div></div>
    <span class="value${hot}">${text}</span>
  </div>`;
}

function fmt(n) {
  if (n === null || n === undefined) return null;
  return Number(n).toLocaleString();
}

function banner(html) { $('banner').innerHTML = html; }

function fatal(msg) {
  $('accounts').innerHTML = `<div class="empty">Cannot reach the backend<br>
    <span class="err">${esc(msg)}</span></div>`;
}

// The header mark mirrors the tray gauge: ring filled to the worst 5h reading.
function setMark(pct, color) {
  const m = $('mark');
  const c = { green: 'var(--green)', amber: 'var(--amber)', red: 'var(--red)' }[color];
  m.style.setProperty('--fill', c || 'var(--faint)');
  m.style.setProperty('--p', Math.max(0, Math.min(100, pct ?? 0)) + '%');
}

function colorOf(pct) {
  if (pct === null || pct === undefined) return 'neutral';
  return pct >= 85 ? 'red' : pct >= 60 ? 'amber' : 'green';
}

async function render() {
  if (!invoke) {
    fatal('window.__TAURI__ is undefined — the page is running without the Tauri bridge.');
    return;
  }
  const st = await invoke('store_status');
  const el = $('store');
  const ok = st.state === 'Shared';
  el.className = 'pill ' + (st.error ? 'bad' : ok ? 'ok' : 'bad');
  el.textContent = st.error ? 'store unreadable'
    : ok ? `shared · ${st.threads} threads` : `${st.state} · ${st.threads} threads`;
  if (st.error) {
    banner(`<div class="banner"><span>Store: ${esc(st.error)}</span></div>`);
  } else {
    banner('');
  }

  const [accts, usages] = await Promise.all([
    invoke('account_list'),
    invoke('usage_all'),
  ]);
  const byName = Object.fromEntries(usages.map((u) => [u.account, u]));

  const worst = usages.reduce((acc, u) =>
    u.fiveHour != null && u.fiveHour > acc ? u.fiveHour : acc, -1);
  setMark(worst < 0 ? null : worst, colorOf(worst < 0 ? null : worst));

  if (!accts.length) {
    $('accounts').innerHTML = `<div class="empty">No accounts yet.<br>
      Use <b>Add account</b> above to create one and sign in.</div>`;
    return;
  }

  $('accounts').innerHTML = accts.map((a) => {
    const u = byName[a.name] || {};
    // A profile can hold credentials the server no longer accepts (revoked or
    // expired session). Offering "Sign in" again is the only way out.
    const needsLogin = !a.loggedIn || (!!u.error && /authentication required/i.test(u.error));
    const live = a.loggedIn && u.fiveHour != null && !u.error && !u.stale;
    const bits = [];
    if (!a.loggedIn) bits.push('<span class="warn">signed out</span>');
    else if (needsLogin) bits.push('<span class="warn">sign-in expired</span>');
    else bits.push(esc(u.plan || 'signed in'));
    if (u.stale) bits.push(`<span class="meta sep">last checked ${esc(u.age || 'a while ago')}</span>`);
    else if (u.error) bits.push('<span class="meta sep err">unavailable</span>');
    if (u.resetsAt) {
      const left = u.resetsAt * 1000 - Date.now();
      if (left > 0) {
        const h = Math.floor(left / 3600000), m = Math.floor((left % 3600000) / 60000);
        bits.push(`<span class="meta sep">resets in ${h > 0 ? h + 'h ' + m + 'm' : m + 'm'}</span>`);
      }
    }

    const foot = [];
    if (u.lifetimeTokens) foot.push(`<span>lifetime <b>${fmt(u.lifetimeTokens)}</b> tokens</span>`);
    if (u.peakDailyTokens) foot.push(`<span>peak day <b>${fmt(u.peakDailyTokens)}</b></span>`);
    if (u.streakDays) foot.push(`<span><b>${u.streakDays}</b>-day streak</span>`);
    if (u.credits != null) foot.push(`<span><b>${Number(u.credits).toFixed(0)}</b> credits</span>`);

    return `<div class="acct">
      <div>
        <div class="row1">
          <span class="dot ${live ? 'live' : ''}"></span>
          <span class="name">${esc(a.name)}</span>
        </div>
      <div class="meta" style="margin-top:2px">${bits.join('')}</div>
      </div>
      <div class="actions">
        ${needsLogin ? `<button data-login="${esc(a.name)}" class="primary">Sign in</button>` : ''}
        ${a.loggedIn && !needsLogin ? `<button data-account="${esc(a.name)}">Open</button>` : ''}
        <button class="mini" data-delete="${esc(a.name)}" title="Remove account">Remove</button>
      </div>
      <div class="bars">
        ${bar('5-hour', u.fiveHour)}
        ${bar('weekly', u.weekly)}
      </div>
      ${foot.length ? `<div class="foot">${foot.join('')}</div>` : ''}
    </div>`;
  }).join('');

  $('accounts').querySelectorAll('button[data-account]').forEach((b) => {
    b.addEventListener('click', async () => {
      const account = b.dataset.account;
      b.disabled = true;
      try { await invoke('open_window', { account }); }
      catch (e) { banner(`<div class="banner"><span>${esc(e)}</span></div>`); }
      b.disabled = false;
    });
  });

  $('accounts').querySelectorAll('button[data-login]').forEach((b) => {
    b.addEventListener('click', () => beginLogin(b.dataset.login));
  });

  $('accounts').querySelectorAll('button[data-delete]').forEach((b) => {
    b.addEventListener('click', () => removeAccount(b.dataset.delete));
  });
}

/* --- add, sign in, remove --- */

let loginPoll = null;

function openAdd() {
  const sel = $('newClone');
  const names = [...$('accounts').querySelectorAll('.name')].map((n) => n.textContent);
  sel.innerHTML = '<option value="">Nothing — start clean</option>' +
    names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  $('newName').value = '';
  $('addDlg').showModal();
  $('newName').focus();
}

$('add').addEventListener('click', openAdd);

$('addForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const name = $('newName').value.trim();
  if (!name) { $('newName').focus(); return; }
  const go = $('addGo');
  go.disabled = true;
  go.textContent = 'Creating…';
  try {
    await invoke('add_account', { name, cloneFrom: $('newClone').value || null });
    $('addDlg').close();
    await refresh();
    beginLogin(name);
  } catch (e) {
    banner(`<div class="banner"><span>Could not add "${esc(name)}": ${esc(e)}</span></div>`);
  }
  go.disabled = false;
  go.textContent = 'Create';
});

async function beginLogin(name) {
  $('loginName').textContent = name;
  const code = $('loginCode');
  const link = $('loginUrl');
  const prog = $('loginProg');
  code.className = 'code waiting';
  code.textContent = 'starting…';
  link.hidden = true;
  link.textContent = '';
  $('stepOpen').className = '';
  $('stepCode').className = '';
  prog.hidden = false;
  $('loginDlg').dataset.account = name;
  $('loginDlg').showModal();

  try {
    await invoke('start_login', { name });
  } catch (e) {
    code.textContent = String(e);
    prog.hidden = true;
    return;
  }

  clearInterval(loginPoll);
  loginPoll = setInterval(async () => {
    let st;
    try { st = await invoke('login_status', { name }); }
    catch { return; }
    if (st.url && link.hidden) {
      link.href = st.url;
      link.textContent = st.url;
      link.hidden = false;
    }
    if (st.code) {
      code.className = 'code';
      code.textContent = st.code;
      $('stepOpen').className = 'done';
    }
    if (st.done) {
      clearInterval(loginPoll);
      loginPoll = null;
      prog.hidden = true;
      // A finished sign-in is not a closed dialog: show the outcome, then let
      // the user dismiss it. Closing on success hid the code before it could
      // be read if the approval landed while the dialog was still open.
      if (st.error) {
        $('stepCode').className = 'done';
        code.className = 'code waiting';
        code.textContent = 'Sign-in failed';
        banner(`<div class="banner"><span>Sign-in for "${esc(name)}" failed: ${esc(st.error)}</span></div>`);
      } else {
        $('stepCode').className = 'done';
        loginDlgClose();
        banner(`<div class="banner" style="border-color:rgba(61,220,151,.3);
          background:rgba(61,220,151,.06);color:#a9f0cd">
          <span>"${esc(name)}" is signed in.</span></div>`);
      }
      refresh();
    }
  }, 1000);
}

function loginDlgClose() {
  clearInterval(loginPoll);
  loginPoll = null;
  $('loginDlg').close();
}

/* Cancel is not just "stop looking": the login child keeps waiting for an
   approval that will never come, with the profile's auth.json already deleted.
   Ask the shell to stop it, which restores the previous credentials. */
async function cancelLogin() {
  const name = $('loginDlg').dataset.account;
  loginDlgClose();
  if (!name) return;
  try { await invoke('cancel_login', { name }); } catch { /* already gone */ }
  banner('<div class="banner" style="border-color:#2a2f37;background:#14171c;color:var(--dim)">' +
    '<span>Sign-in cancelled. The previous credentials were kept.</span></div>');
  refresh();
}

/* A styled replacement for window.confirm(), which wry does not implement in
   its WebKitGTK build: `confirm()` either returns undefined or does nothing, so
   Remove looked dead. */
let askResolve = null;

function ask({ title, body, note, action, danger = true }) {
  $('askTitle').textContent = title;
  $('askBody').textContent = body;
  $('askNote').textContent = note || '';
  const go = $('askGo');
  go.textContent = action;
  go.className = danger ? 'danger' : 'primary';
  $('askDlg').showModal();
  return new Promise((resolve) => { askResolve = resolve; });
}

$('askGo').addEventListener('click', () => {
  $('askDlg').close();
  const r = askResolve; askResolve = null;
  if (r) r(true);
});

$('askDlg').addEventListener('close', () => {
  const r = askResolve; askResolve = null;
  if (r) r(false);
});

async function removeAccount(name) {
  const ok = await ask({
    title: `Remove “${name}”?`,
    body: 'Its profile and window data move to a backup folder. Nothing is deleted.',
    note: 'Chats live in the shared store and stay where they are. You can sign this account back in later.',
    action: 'Remove',
  });
  if (!ok) return;
  try {
    const r = await invoke('delete_account', { name });
    banner(`<div class="banner" style="border-color:rgba(61,220,151,.3);
      background:rgba(61,220,151,.06);color:#a9f0cd">
      <span>Removed "${esc(name)}" · moved to ${esc(r.backup)}</span></div>`);
    await refresh();
  } catch (e) {
    banner(`<div class="banner"><span>Could not remove "${esc(name)}": ${esc(e)}</span></div>`);
  }
}

// The tray's "Add account…" sends this event after raising the window.
if (window.__TAURI__?.event?.listen) {
  window.__TAURI__.event.listen('add-account', () => openAdd());
}

// Dialogs close on backdrop click and on any [data-close] button.
document.querySelectorAll('dialog').forEach((d) => {
  d.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-cancel-login]')) {
      cancelLogin();
      return;
    }
    if (ev.target === d || ev.target.closest('[data-close]')) {
      if (d.id === 'loginDlg') { loginDlgClose(); return; }
      d.close();
    }
  });
});

async function refresh() {
  try { await render(); } catch (e) { fatal(String(e)); }
}

$('repair').addEventListener('click', async () => {
  const btn = $('repair');
  btn.disabled = true;
  btn.textContent = 'Repairing…';
  try {
    const r = await invoke('repair_store');
    banner(`<div class="banner" style="border-color:rgba(61,220,151,.3);
      background:rgba(61,220,151,.06);color:#a9f0cd">
      <span>Store ${esc(r.state.toLowerCase())} · ${r.threads} threads · backup at ${esc(r.backup)}</span></div>`);
  } catch (e) {
    banner(`<div class="banner"><span>${esc(e)}</span></div>`);
  }
  btn.disabled = false;
  btn.textContent = 'Repair store';
  refresh();
});

$('refresh').addEventListener('click', refresh);
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
