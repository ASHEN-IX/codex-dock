[package]
name = "codex-dock"
version = "0.1.0"
edition = "2021"

[dependencies]
codex-dock-core = { path = "../core" }
serde_json = "1"
# image-png is required for Image::from_bytes (tray icon decoding).
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[build-dependencies]
tauri-build = { version = "2" }
